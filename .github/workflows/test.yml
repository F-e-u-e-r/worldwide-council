name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development quality tools
        run: python -m pip install -r requirements-dev.txt
      - name: Run Ruff
        run: ruff check .
      - name: Compile Python sources
        run: python -m compileall orchestrator tests scripts examples
      - name: Check generated quote policy surfaces
        run: python scripts/generate_quote_policy.py --check
      - name: Check corpus inventory (structural/policy violations only)
        run: python scripts/corpus_inventory.py --check
      - name: Check retrieval benchmark fixtures
        run: python scripts/run_retrieval_benchmark.py --check-fixtures
      - name: Run strict finalization example
        run: python examples/strict-finalization/run_example.py
      - name: Run test suite
        run: python -m unittest discover -s tests -v

  plugin-validate:
    # The repository is also a Claude Code plugin (self-hosted marketplace): keep both manifests
    # loadable. --strict fails on warnings (unknown fields, missing metadata, missing paths).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.283  # pinned: the version validated locally
      - name: Validate plugin manifest (strict)
        run: claude plugin validate --strict .claude-plugin/plugin.json
      - name: Validate marketplace manifest (strict)
        run: claude plugin validate --strict .claude-plugin/marketplace.json
